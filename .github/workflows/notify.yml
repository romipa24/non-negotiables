name: Notificaciones

# Runs every hour; notify/send.js decides what to send using the phone's own time zone.
on:
  schedule:
    - cron: '27 * * * *'   # lunes 6:30 · pesarse
    - cron: '42 * * * *'   # cada hora de 6:45 a 22:45 · frases (si hay MENTALIDAD)
    - cron: '57 * * * *'   # cada día 20:00 · hábitos
  workflow_dispatch:
    inputs:
      kind:
        description: 'Qué aviso enviar ahora'
        type: choice
        options: [daily, weigh, phrase]
        default: daily
      phrase:
        description: 'Número de frase (solo para phrase)'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web-push
        working-directory: notify
        run: npm install --no-audit --no-fund
      - name: Send
        working-directory: notify
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          MENTALIDAD: ${{ secrets.MENTALIDAD }}
          SCHEDULE: ${{ github.event.schedule }}
          KIND: ${{ inputs.kind }}
          PHRASE: ${{ inputs.kind == 'phrase' && inputs.phrase || '' }}
        run: node send.js
      # GitHub pauses scheduled workflows after 60 days without commits. Keep it alive.
      - name: Keep schedule alive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
