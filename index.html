<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<script>/* apply the saved theme before first paint */try{var _d=JSON.parse(localStorage.getItem('nn-data-v1')||'{}'),_t=_d.theme||'dark';if(_t==='auto')_t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',_t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<style>
/* Layout: one-column phone app. Sticky top bar, three views, fixed bottom tabs.
   Deep green-black panels (or light ones in Day mode); jade green marks what is done and what is a record. */
/* Night (default) and Day themes. Every colour in the app comes from these tokens.
   --a1/--a2/--a3 are the accent as "r,g,b" so they can be used with any alpha. */
:root{
  --bg:#060B08; --bg-rgb:6,11,8; --panel:#0C1510; --panel-2:#111E17; --line:#1A2920; --line-2:#284032;
  --fg:#E6F0E8; --muted:#82978A; --dim:#4C5F53;
  --acc:#1FBF6B; --acc-hi:#5BEA9A; --acc-lo:#0C2618; --a1:31,191,107; --a2:91,234,154; --a3:190,255,214;
  --glow:#C8FFDD; --on-acc:#03130A; --track:#15231B; --slot:#0E1813;
  --good:#7FD69B; --bad:#E0573F; --bad-hi:#FF8A70; --bad-lo:#7A2A1C;
  --statusbar:#060B08; --shadow:0,0,0; --panel-sh:inset 0 1px 0 rgba(255,255,255,.035);
  --f-display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EEF3EC; --bg-rgb:238,243,236; --panel:#FFFFFF; --panel-2:#F5F9F3; --line:#DFE7DC; --line-2:#C6D4C3;
  --fg:#0B1810; --muted:#5A6D61; --dim:#97A89C;
  --acc:#12934E; --acc-hi:#0B7A3E; --acc-lo:#DCF2E4; --a1:18,147,78; --a2:11,122,62; --a3:110,214,152;
  --glow:#9EEFC0; --on-acc:#FFFFFF; --track:#E3EBE0; --slot:#F0F5EE;
  --good:#12934E; --bad:#C23E28; --bad-hi:#C23E28; --bad-lo:#F2C4B8;
  --statusbar:#0B5E31; --shadow:20,45,30; --panel-sh:0 1px 2px rgba(20,45,30,.06),0 6px 18px rgba(20,45,30,.05);
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--fg);margin:0}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(130% 50% at 50% -8%,rgba(var(--a1),.13),transparent 62%),var(--bg);
  min-height:100vh;overscroll-behavior-y:none;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--statusbar)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc-hi);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px;background:linear-gradient(var(--bg) 70%,transparent)}
.brand{font-family:var(--f-display);font-size:26px;letter-spacing:.06em;line-height:1}
.brand span{color:var(--acc)}

.view{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--panel-sh)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.h-display{font-family:var(--f-display);font-weight:400;letter-spacing:.03em;line-height:.95;margin:0;text-wrap:balance}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head h2{font-family:var(--f-display);font-size:22px;letter-spacing:.06em;font-weight:400;margin:0}
.muted{color:var(--muted)}

.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:6px}
.dayhead h1{font-size:clamp(44px,13vw,60px)}
.daynav{display:flex;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--fg);background:var(--panel)}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.chip.lv-weak{color:var(--bad);border-color:rgba(194,85,63,.45)}
.chip.lv-solid{color:var(--fg);border-color:var(--line-2)}
.chip.lv-elite{color:var(--acc-hi);border-color:rgba(var(--a2),.5);background:var(--acc-lo)}
.linkbtn{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--acc-hi);padding:6px 0}

.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:112px;height:112px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1}
.ring .val small{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.score-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.kv b{font-family:var(--f-num);font-size:22px;font-weight:600}

.habits{display:flex;flex-direction:column;gap:8px}
.habit{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);transition:background .15s,border-color .15s}
.habit .box{width:30px;height:30px;border-radius:8px;border:2px solid var(--line-2);display:grid;place-items:center;transition:all .15s}
.habit .box svg{width:18px;height:18px;opacity:0;color:var(--on-acc);transition:opacity .15s}
.habit.on{background:linear-gradient(90deg,rgba(var(--a1),.12),rgba(var(--a1),.03));border-color:rgba(var(--a1),.35)}
.habit.on .box{background:var(--acc);border-color:var(--acc)}
.habit.on .box svg{opacity:1}
.habit .name{font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.habit .sub{font-size:12px;color:var(--muted)}
.habit .streak{display:flex;align-items:center;gap:4px;font-family:var(--f-num);font-size:18px;font-weight:600;color:var(--muted)}
.habit .streak svg{width:15px;height:15px}
.habit.on .streak{color:var(--acc-hi)}
.editbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc-hi);padding:8px 12px;border-radius:999px;border:1px solid rgba(var(--a2),.4)}
.editbtn svg{width:14px;height:14px}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;border:1px dashed var(--line-2);color:var(--muted);font-weight:600;font-size:14px;letter-spacing:.04em}
.addrow svg{width:16px;height:16px}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;border:1px dashed rgba(var(--a2),.5);background:var(--acc-lo);color:var(--acc-hi);font-weight:600;font-size:14px}
.banner button{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:8px 12px;border-radius:8px;background:var(--acc);color:var(--on-acc);white-space:nowrap}

.wgrid{display:grid;grid-template-columns:minmax(60px,1.5fr) repeat(7,minmax(22px,1fr)) 40px;gap:5px;align-items:center}
.wgrid .hd{font-size:11px;font-weight:700;color:var(--dim);text-align:center;letter-spacing:.06em}
.wgrid .hd.today{color:var(--acc-hi)}
.wgrid .lbl{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wgrid .pc{font-family:var(--f-num);font-size:14px;text-align:right;color:var(--muted)}
.cell{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--track);border:1px solid var(--line)}
.cell.on{background:var(--acc);border-color:var(--acc)}
.cell.fut{opacity:.35;cursor:default}
.cell.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--muted)}
.wfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);gap:10px}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}

.hero{position:relative;overflow:hidden;padding:20px 18px;border-radius:16px;border:1px solid rgba(var(--a1),.35);background:radial-gradient(90% 120% at 100% 0%,rgba(var(--a1),.22),transparent 60%),var(--panel)}
.hero .big{font-family:var(--f-display);font-size:96px;line-height:.85;color:var(--acc-hi)}
.hero .unit{font-family:var(--f-display);font-size:26px;letter-spacing:.06em;color:var(--fg)}
.hero .flame{position:absolute;right:-10px;bottom:-18px;width:150px;height:150px;color:var(--acc);opacity:.13}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.scard.rec{border-color:rgba(var(--a1),.45)}
.scard .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scard .t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.badge{font-size:9px;font-weight:700;letter-spacing:.14em;padding:3px 7px;border-radius:999px;background:var(--acc);color:var(--on-acc);white-space:nowrap}
.scard .n{display:flex;align-items:baseline;gap:6px}
.scard .n b{font-family:var(--f-display);font-size:54px;line-height:.9}
.scard .n span{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc-hi));border-radius:3px}
.best{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.best svg{width:14px;height:14px;color:var(--acc)}
.best b{font-family:var(--f-num);font-size:15px;color:var(--fg)}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.dots.w{grid-template-columns:repeat(8,1fr)}
.dots i{height:8px;border-radius:2px;background:var(--track)}
.dots i.on{background:var(--acc)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--f-num);font-size:28px;font-weight:600;line-height:1.1}
.stat b.up{color:var(--good)} .stat b.down{color:var(--bad)}
.stat span{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{width:100%;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:12px}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:90px;resize:vertical}
input.kg{font-family:var(--f-num);font-size:24px;font-weight:600;padding:8px 12px}
.btn{width:100%;padding:14px;border-radius:10px;background:var(--acc);color:var(--on-acc);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line-2)}
.btn.danger{background:var(--bad);color:#fff}
.span2{grid-column:1/-1}
.log{display:flex;flex-direction:column}
.log .row{display:grid;grid-template-columns:1fr auto auto 36px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.log .row:last-child{border-bottom:0}
.log .d{font-weight:600}
.log .d small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.log .kgv{font-family:var(--f-num);font-size:20px;font-weight:600}
.log .dl{font-family:var(--f-num);font-size:14px;min-width:48px;text-align:right}
.log .dl.up{color:var(--good)} .log .dl.down{color:var(--bad)} .log .dl.flat{color:var(--dim)}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--dim)}
.x svg{width:14px;height:14px}
.x.armed{background:var(--bad);color:#fff}

.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:24px;letter-spacing:.05em;font-weight:400;margin-bottom:4px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(var(--bg-rgb),.97);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}

/* ---------- books: 40 in a year ---------- */
.bk-hero{position:relative;overflow:hidden;padding:22px 18px 18px;border-radius:16px;border:1px solid rgba(var(--a1),.4);background:radial-gradient(90% 90% at 50% 0%,rgba(var(--a1),.24),transparent 65%),var(--panel);text-align:center}
.bk-hero .eyebrow{color:var(--acc-hi)}
.bk-num{font-family:var(--f-display);font-size:clamp(120px,38vw,170px);line-height:.82;color:var(--fg);margin:10px 0 4px;text-shadow:0 0 40px rgba(var(--a2),.35)}
.bk-num small{display:block;font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:10px;text-shadow:none}
.bk-num.pop{animation:slam .55s cubic-bezier(.2,1.4,.3,1) both}
.bk-line{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:16px}
.bk-end{font-family:var(--f-display);font-size:30px;line-height:1;min-width:34px}
.bk-end.from{color:var(--muted)}
.bk-end.to{color:var(--acc-hi)}
.bk-track{position:relative;height:14px;border-radius:7px;background:var(--track);border:1px solid var(--line)}
.bk-fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,var(--acc-lo),var(--acc) 60%,var(--acc-hi));box-shadow:0 0 16px rgba(var(--a2),.45);transition:width 1s linear}
.bk-fill::after{content:"";position:absolute;right:-7px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 4px rgba(var(--a2),.25),0 0 18px rgba(var(--a3),.9);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(var(--a2),0),0 0 26px rgba(var(--a3),1)}}
.bk-meta{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.bk-meta b{font-family:var(--f-num);font-size:15px;color:var(--fg);font-variant-numeric:tabular-nums}
.bk-add{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;border-radius:14px;background:linear-gradient(180deg,var(--acc-hi),var(--acc));color:var(--on-acc);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:15px;box-shadow:0 10px 30px rgba(var(--a1),.3)}
.bk-add svg{width:20px;height:20px}
.bk-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;border-radius:14px;border:1px solid rgba(var(--a2),.45);background:var(--panel-2)}
.bk-status{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.bk-status .ic{font-size:30px;line-height:1}
.bk-status b{display:block;font-family:var(--f-display);font-size:24px;letter-spacing:.04em;font-weight:400;line-height:1.05}
.bk-status p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.bk-status.ahead{border-color:rgba(var(--a2),.55);background:linear-gradient(135deg,rgba(var(--a1),.16),transparent 70%),var(--panel)}
.bk-status.ahead b{color:var(--acc-hi)}
.bk-status.ok b{color:var(--good)}
.bk-status.behind{border-color:rgba(194,85,63,.6);background:linear-gradient(135deg,rgba(194,85,63,.18),transparent 70%),var(--panel)}
.bk-status.behind b{color:var(--bad-hi)}
.bk-score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bk-pages{position:relative;overflow:hidden;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.bk-pages.over{border-color:rgba(194,85,63,.6);background:radial-gradient(90% 120% at 100% 0%,rgba(194,85,63,.2),transparent 60%),var(--panel)}
.bk-pages.under{border-color:rgba(var(--a2),.5);background:radial-gradient(90% 120% at 100% 0%,rgba(var(--a1),.2),transparent 60%),var(--panel)}
.bk-pages .row1{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.bk-pages .big{font-family:var(--f-display);font-size:clamp(72px,24vw,104px);line-height:.85;color:var(--fg)}
.bk-pages.over .big{color:var(--bad-hi)}
.bk-pages.under .big{color:var(--acc-hi)}
.bk-pages .unit{font-family:var(--f-display);font-size:24px;letter-spacing:.05em;line-height:1.05}
.bk-pages .unit small{display:block;font-family:var(--f-body);font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.bk-pages .msg{margin:10px 0 0;font-size:14px;font-weight:600}
.bk-pages.over .msg{color:var(--bad-hi)}
.bk-pages.under .msg{color:var(--acc-hi)}
.pgbars{display:grid;gap:8px;margin-top:14px}
.pgbar{display:grid;grid-template-columns:86px 1fr 52px;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.pgbar .tr{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.pgbar .tr i{display:block;height:100%;border-radius:5px;background:var(--dim);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.pgbar.now .tr i{background:linear-gradient(90deg,var(--acc),var(--acc-hi))}
.bk-pages.over .pgbar.now .tr i{background:linear-gradient(90deg,var(--bad-lo),var(--bad-hi))}
.pgbar b{font-family:var(--f-num);font-size:16px;color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
.bk-pages .foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.bk-pages .foot b{font-family:var(--f-num);font-size:15px;color:var(--fg)}

/* header brand shrinks on scroll */
.brand{transform-origin:0 50%;transition:transform .25s ease}
.seg button{font-family:var(--f-num);font-size:13px}

/* ---------- surfaces ---------- */
body{background:radial-gradient(120% 45% at 50% -10%,rgba(var(--a1),.16),transparent 60%),radial-gradient(60% 30% at 100% 40%,rgba(var(--a1),.05),transparent 70%),var(--bg);background-repeat:no-repeat}
.habit{border-radius:16px}
.habit.on{box-shadow:0 0 0 1px rgba(var(--a1),.25),0 8px 24px -12px rgba(var(--a1),.45)}
.iconbtn{border-radius:12px}
.btn{border-radius:12px}

/* ---------- header that shrinks on scroll, with a progress line ---------- */
.top{transition:background .25s,box-shadow .25s}
.top.small{background:rgba(var(--bg-rgb),.96);box-shadow:0 1px 0 var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top.small .brand{transform:scale(.86)}
.sprog{position:absolute;left:0;bottom:-1px;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--acc),var(--acc-hi));box-shadow:0 0 10px rgba(var(--a2),.6)}

/* ---------- scroll depth: blocks rise in from below and sink away at the top (driven from JS) ---------- */
#main>*{transform-origin:50% 0}
#main>.card{transform-origin:50% 0}
#main>.txt{transform-origin:50% 100%}
/* Scroll deck on the browser's own animation engine (runs off the main thread, smooth at the screen's refresh rate).
   JS only tags each block once per render: .card or .txt, and --lag (how far a card trails as it leaves). */
@supports (animation-timeline: view()){
  #main>.dk{animation:deckIn linear backwards,deckOut linear forwards;animation-timeline:view(var(--it,70px) 84px),view(var(--it,70px) 84px);
    animation-range:entry 0% entry min(100%,400px),exit calc(100% - min(100%,330px)) exit 100%}
  #main>.dk.txt{animation-name:deckIn,deckOutTxt}
  .sprog{animation:prog linear both;animation-timeline:scroll(root)}
}
@keyframes deckIn{from{transform:translate3d(0,240px,0) scale(.66);opacity:.05}}
@keyframes deckOut{to{transform:translate3d(0,var(--lag,200px),0) scale(.64);opacity:.08}}
@keyframes deckOutTxt{to{transform:translate3d(0,-70px,0) scale(.8);opacity:0}}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- tab bar: sliding pill ---------- */
.tabs nav{position:relative}
.tabpill{position:absolute;top:6px;bottom:8px;left:0;width:25%;border-radius:14px;background:rgba(var(--a1),.12);box-shadow:inset 0 0 0 1px rgba(var(--a1),.22);transition:transform .38s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.tab.on::before{display:none}
.tab{z-index:1}
.tab.on svg{transform:translateY(-1px) scale(1.08);transition:transform .25s}

/* ---------- tab change: slide in the direction you moved ---------- */
.view.from-r{animation:slideL .55s cubic-bezier(.16,1,.3,1) both}
.view.from-l{animation:slideR .55s cubic-bezier(.16,1,.3,1) both}
@keyframes slideL{from{opacity:0;transform:translateX(105%) scale(.72)}}
@keyframes slideR{from{opacity:0;transform:translateX(-105%) scale(.72)}}

/* ---------- theme switch ---------- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line)}
.seg button{padding:11px 6px;border-radius:10px;font-family:var(--f-num);font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--acc);color:var(--on-acc);box-shadow:0 6px 16px -6px rgba(var(--a1),.7)}
.seg svg{width:15px;height:15px}
html{transition:background-color .3s}
@media (prefers-reduced-motion:reduce){#main>*{transform:none!important;opacity:1!important;animation:none!important}}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="brand">NON <span>NEGOTIABLES</span></div>
    <button class="iconbtn" data-act="sheet" data-sheet="backup" aria-label="Ajustes" id="gear"></button>
    <i class="sprog" id="sprog" aria-hidden="true"></i>
  </header>
  <main id="main" class="view"></main>
</div>
<div class="tabs"><nav><span class="tabpill" id="tabpill" aria-hidden="true"></span><div id="tabs" style="display:contents"></div></nav></div>
<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>
<div id="flash" class="flash" hidden></div>
<div id="celebrate" class="celebrate" hidden></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
const I = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

  crown:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-1.8 11H4.8z"/></svg>',

  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5" fill="currentColor"/></svg>',
  dumbbell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6v12M17.5 6v12M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>',
};

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; };
const monday = d => addDays(d, -((d.getDay()+6)%7));
const todayK = () => key(new Date());
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const INI = ['L','M','X','J','V','S','D'];
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtShort = k => { const d = parse(k); return `${d.getDate()} ${MES[d.getMonth()]}`; };
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Weights keep grams (up to 3 decimals). Shown with a comma, at least one decimal: 72,3 · 72,35 · 72,355
const kgf = v => { let s = (Math.round(v*1000)/1000).toFixed(3).replace(/0{1,2}$/,''); return s.replace('.',','); };
// Accepts "72,35", "72.35", "72 350" or "72,350 kg"; returns kg or NaN.
const parseKg = raw => { const s=String(raw||'').trim().toLowerCase().replace(/kg/g,'').replace(/\s+/g,'').replace(',','.'); return /^\d{1,3}(\.\d{1,3})?$/.test(s) ? Math.round(parseFloat(s)*1000)/1000 : NaN; };

/* ---------- state, saved on this phone ---------- */
const KEY = 'nn-data-v1';
const TABS = ['hoy','rachas','peso','libros'];
const S = { habits:[], goal:null, days:{}, weights:[], records:{}, books:[], lastBackup:null, sound:true, sel:todayK(), tab:'hoy', sheet:null, armed:null, just:null, enter:true, addingBook:false, newBook:null };
const P = { ring:0, xp:0 }; // last drawn values, so the ring and the XP bar animate from where they were
function load(){
  try { const d = JSON.parse(localStorage.getItem(KEY)||'null'); if (d) apply(d); } catch(e){}
}
function apply(d){
  S.habits = Array.isArray(d.habits) ? d.habits : [];
  S.goal = typeof d.goal==='number' ? d.goal : null;
  S.days = d.days && typeof d.days==='object' ? d.days : {};
  S.weights = Array.isArray(d.weights) ? d.weights.filter(w=>w && w.date && w.kg>0).sort((a,b)=>a.date<b.date?-1:1) : [];
  S.records = d.records && typeof d.records==='object' ? d.records : {};
  S.books = Array.isArray(d.books) ? d.books.filter(b=>b && b.title && b.date).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.at||0)-(b.at||0)) : [];
  if (d.lastBackup) S.lastBackup = d.lastBackup;
  S.sound = d.sound !== false;
  S.pushTz = d.pushTz || S.pushTz || null;

/* ---------- maths ---------- */
const doneOn = (k,id) => !!(S.days[k] && S.days[k][id]);
function weekCount(h, w){ let c=0; for (let i=0;i<7;i++) if (doneOn(key(addDays(w,i)),h.id)) c++; return c; }
function streak(h){
  const tK = todayK(), t = parse(tK);
  const keys = Object.keys(S.days).filter(k => S.days[k][h.id] && k <= tK).sort();
  let run=0, best=0;
  if (keys.length){
    if (h.type==='weekly'){
      const end = monday(t), endK = key(end);
      for (let w = monday(parse(keys[0])); w <= end; w = addDays(w,7)){
        if (weekCount(h,w) >= h.target){ run++; best=Math.max(best,run); }
        else if (key(w)!==endK) run=0;
      }
    } else {
      for (let d = parse(keys[0]); d <= t; d = addDays(d,1)){
        const k = key(d);
        if (doneOn(k,h.id)){ run++; best=Math.max(best,run); }
        else if (k!==tK) run=0;
      }
    }
  }
  return { cur:run, computed:best, best:Math.max(best, S.records[h.id]||0) };
}
// A day is perfect when every daily habit is done. A weekly habit (gym 4×) counts on the days it is done
// and never holds a rest day back from 100%.
function dayStats(k){
  let done=0, total=0, left=0;
  S.habits.forEach(h => { const on=doneOn(k,h.id);
    if (h.type==='weekly'){ if (on){ done++; total++; } }
    else { total++; if (on) done++; else left++; } });
  return { done, total, left, pct: total ? done/total : 0, perfect: total>0 && left===0 && done>0 };
}
const dayPct = k => dayStats(k).pct;
function perfectRun(k){ let n=0; for (let d=parse(k); n<3660 && dayStats(key(d)).perfect; d=addDays(d,-1)) n++; return n; }

/* ---------- XP and levels, always derived from the history ---------- */
const RANKS = [[1,'RECLUTA'],[3,'SOLDADO'],[5,'GUERRERO'],[8,'GLADIADOR'],[12,'ESPARTANO'],[16,'TITÁN'],[20,'LEYENDA'],[30,'INQUEBRANTABLE']];
function xpTotal(){
  let xp=0; const ids=new Set(S.habits.map(h=>h.id));
  for (const k in S.days){ let c=0; for (const id in S.days[k]) if (ids.has(id)) c++; xp += c*10; if (c && dayStats(k).perfect) xp += 50; }
  return xp + S.weights.length*20 + S.books.length*100;
}
function levelInfo(){
  const xp=xpTotal(); let lv=1; while (75*lv*(lv+1) <= xp) lv++;
  const base=75*(lv-1)*lv, need=150*lv;
  return { xp, lv, cur:xp-base, need, pct:(xp-base)/need, rank:RANKS.filter(r=>r[0]<=lv).pop()[1] };
}

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const fx = document.getElementById('fx'), fctx = fx.getContext('2d'); let parts=[], fxRun=false;
function fxSize(){ const d=Math.min(window.devicePixelRatio||1,2); fx.width=innerWidth*d; fx.height=innerHeight*d; fctx.setTransform(d,0,0,d,0,0); }
window.addEventListener('resize', fxSize); fxSize();
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let COLS = []; const refreshCols = () => { COLS = ['--acc-hi','--acc','--glow','--fg','--acc-hi'].map(cssv); };
function spawn(x, y, n, o={}){
  if (reduce) return;
  for (let i=0;i<n;i++){
    const a=(o.angle??-Math.PI/2)+(Math.random()-.5)*(o.spread??Math.PI*2), sp=(o.speed??7)*(.35+Math.random()*.9);
    parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, g:o.gravity??.32, life:1, decay:(o.decay??.02)*(.7+Math.random()*.6), s:(o.size??5)*(.6+Math.random()*.8), c:COLS[(Math.random()*COLS.length)|0], r:Math.random()*6.28, vr:(Math.random()-.5)*.4, sq:Math.random()<.6 });
  }

}
function fxTick(){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p => p.life>0 && p.y<innerHeight+40);
  for (const p of parts){
    p.vx*=.985; p.vy=p.vy*.985+p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=p.decay;
    fctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6)); fctx.fillStyle=p.c;
    if (p.sq){ fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.r); fctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); fctx.restore(); }
    else { fctx.beginPath(); fctx.arc(p.x,p.y,p.s/2,0,6.28); fctx.fill(); }
  }
  fctx.globalAlpha=1;
  if (parts.length) requestAnimationFrame(fxTick); else fxRun=false;
}
function rain(n){
  for (let i=0;i<n;i++) setTimeout(()=>spawn(Math.random()*innerWidth,-10,1,{angle:Math.PI/2,spread:.8,speed:5,gravity:.12,decay:.008,size:8}), Math.random()*900);
  spawn(innerWidth*.08,innerHeight*.78,45,{angle:-1.1,spread:.9,speed:17,decay:.012,size:7});
  spawn(innerWidth*.92,innerHeight*.78,45,{angle:-2.04,spread:.9,speed:17,decay:.012,size:7});

let actx=null;
function tone(f, t0, dur, type='triangle', vol=.16){
  const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+.03);
}
const SCALE = [523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1568,1760];
function sfx(name, n=0){
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if (actx.state==='suspended') actx.resume();
    const t=actx.currentTime+.01;
    if (name==='check'){ const f=SCALE[Math.max(0,Math.min(n,SCALE.length-1))]; tone(f,t,.16); tone(f*2,t+.05,.2,'sine',.08); } // climbs with each habit of the day
    else if (name==='uncheck') tone(220,t,.12,'sine',.1);
    else if (name==='tap') tone(660,t,.05,'sine',.04);
    else if (name==='coin'){ tone(987.77,t,.09,'square',.06); tone(1318.5,t+.08,.3,'square',.06); }
    else if (name==='milestone') [659.25,880,1318.5].forEach((f,i)=>tone(f,t+i*.08,.3,'triangle',.12));
    else if (name==='perfect'){ [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,t+i*.09,.35,'triangle',.14)); tone(1046.5,t+.5,.9,'sine',.12); tone(1568,t+.5,.9,'sine',.08); }
    else if (name==='level'){ [392,523.25,659.25,783.99,1046.5,1318.5,1568].forEach((f,i)=>tone(f,t+i*.07,.4,'sawtooth',.05)); tone(2093,t+.55,1,'sine',.1); }
  } catch(e){}
}

function weekScore(w){
  if (!S.habits.length) return 0;
  const tK = todayK(); const isCur = key(monday(parse(tK)))===key(w);
  const elapsed = isCur ? ((parse(tK).getDay()+6)%7)+1 : 7;
  let sum = 0;
  S.habits.forEach(h => { const c = weekCount(h,w); sum += h.type==='weekly' ? Math.min(c/h.target,1) : Math.min(c/elapsed,1); });
  return sum / S.habits.length;
}

function toggle(k, id, el){
  if (k > todayK()) return;
  const h = S.habits.find(x=>x.id===id); if (!h) return;
  const before = { lv:levelInfo().lv, st:streak(h), perfect:dayStats(k).perfect };
  const cur = {...(S.days[k]||{})};
  const on = !cur[id];
  if (on){ cur[id] = true; S.just = k+'|'+id; } else delete cur[id];
  if (Object.keys(cur).length) S.days[k] = cur; else delete S.days[k];
  syncRecords(); save();
  const r = el && el.getBoundingClientRect(), x = r ? r.left+r.width/2 : innerWidth/2, y = r ? r.top+r.height/2 : innerHeight/2;
  render();
  if (!on){ sfx('uncheck'); return; }
  if (navigator.vibrate) try { navigator.vibrate(12); } catch(e){}
  const ds = dayStats(k), lv = levelInfo(), st = streak(h), unit = h.type==='weekly' ? 'semanas' : 'días';
  spawn(x, y, 18, { speed:6, decay:.03, size:5 });
  floatText(x, y, '+10 XP');
  const nowPerfect = ds.perfect && !before.perfect;
  if (nowPerfect){
    const run = perfectRun(k);
    celebrate({ kicker:k===todayK()?'Hoy':fmtShort(k), title:'DÍA PERFECTO', sub:`${ds.done}/${ds.total} hechos · +50 XP${run>1?` · ${run} días perfectos seguidos`:''}`, sound:'perfect' });
  } else sfx('check', ds.done-1);
  if (lv.lv > before.lv) celebrate({ kicker:'Subes de nivel', title:'NIVEL '+lv.lv, sub:lv.rank, sound:'level' });
  if (st.cur > before.st.best && st.cur >= 2){ flash('👑', 'Nuevo récord · '+h.name, `${st.cur} ${unit} seguidos`); if (!nowPerfect) sfx('milestone'); }
  else if (st.cur > before.st.cur && [3,7,14,21,30,50,75,100,150,200,300,365].includes(st.cur)){ flash('🔥', `${st.cur} ${unit} · ${h.name}`, 'Racha en marcha. No la sueltes.'); if (!nowPerfect) sfx('milestone'); }
}

function weightChart(){

/* ---------- books: the 40-book challenge, 31 May 2026 to 31 May 2027 ---------- */
const CH = { start:new Date(2026,4,31).getTime(), end:new Date(2027,4,31).getTime(), goal:40, startK:'2026-05-31', pagesPerBook:400 };
// Pages a day needed from today: pages of the books still to read / days left (today included).
function pagesPlan(){
  const read=Math.min(S.books.length, CH.goal), leftBooks=CH.goal-read, leftPages=leftBooks*CH.pagesPerBook;
  const t=parse(todayK()).getTime(), daysLeft=Math.max(1, Math.round((CH.end-t)/864e5));
  const totalDays=Math.round((CH.end-CH.start)/864e5), base=Math.ceil(CH.goal*CH.pagesPerBook/totalDays);
  return { read, leftBooks, leftPages, daysLeft, base, need: leftBooks ? Math.ceil(leftPages/daysLeft) : 0, total: CH.goal*CH.pagesPerBook };
}
const nf = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); // 6.800 · 12.000
function pace(now=Date.now()){
  const span=CH.end-CH.start, per=span/CH.goal, el=Math.min(Math.max(now-CH.start,0),span);
  const exp=el/per, done=Math.min(CH.goal,Math.floor(exp+1e-9));
  return { per, exp, done, cur:Math.min(CH.goal,done+1), frac: done>=CH.goal ? 1 : exp-done,
    nextAt: CH.start+(done+1)*per, daysLeft: Math.max(0,(CH.end-now)/864e5), daysIn: el/864e5,
    started: now>=CH.start, ended: now>=CH.end };
}
const deadlineOf = n => CH.start + n*(CH.end-CH.start)/CH.goal;          // when book n should be finished
const plural = (n, a, b) => n===1 ? a : b;
function dur(ms){ // 2d 08:14:33

  return `${d}d ${pad(h)}:${pad(m)}:${pad(x)}`;
}
const fmtLong = ms => { const d=new Date(ms); return `${DIAS[d.getDay()].toLowerCase()} ${d.getDate()} ${MES[d.getMonth()]}`; };
function bookStatus(){
  const p=pace(), read=S.books.length, lead=read-p.done, left=CH.goal-read;
  if (read>=CH.goal) return { cls:'ahead', ic:'🏆', t:'RETO CUMPLIDO', s:`${read} libros. Lo has hecho.` };
  if (p.ended) return { cls:'behind', ic:'⏱️', t:`${read} DE 40`, s:'El reto ha terminado.' };
  const need = left ? p.daysLeft/left : 0, needTxt = need>=1 ? `1 libro cada ${need.toFixed(1).replace('.',',')} días` : `${(1/need).toFixed(1).replace('.',',')} libros al día`;
  if (lead>0) return { cls:'ahead', ic:'🔥', t:`+${lead} ${plural(lead,'LIBRO','LIBROS')} DE VENTAJA`, s:`Vas por delante del ritmo. El libro ${read+1} no te toca hasta el ${fmtLong(deadlineOf(read+1))}.` };
  if (lead===0) return { cls:'ok', ic:'✅', t:'VAS AL RITMO', s:`Termina el libro ${read+1} antes del ${fmtLong(deadlineOf(read+1))} para no quedarte atrás.` };
  return { cls:'behind', ic:'⚠️', t:`${-lead} ${plural(-lead,'LIBRO','LIBROS')} POR DETRÁS`, s:`Tienes que leer más. Para llegar a 40 te hace falta ${needTxt} desde hoy, unas ${pagesPlan().need} páginas al día.` };

/* ---------- scroll: blocks rise in from below and sink back as they leave the top; header shrinks ---------- */
// A deck of cards, always in order, straight and centred.
// Coming in from the bottom, a card grows from small and slides up into place.
// Going out at the top, a card slows down as if pinned under the header, shrinks and dims,
// and the next card slides over it, so the page piles up like a stack.
// Where the browser supports scroll-driven CSS animations (iOS 26+), the CSS above does all of it
// on the compositor. Otherwise this JS fallback runs, reading no layout while scrolling: every
// position is measured once per render (tagBlocks) and reused.
const CSS_SCROLL = !!(window.CSS && CSS.supports && CSS.supports('animation-timeline: view()'));
let sfxQueued=false, blocks=[], headBottom=70, docMax=1;
function tagBlocks(){
  const main=document.getElementById('main'), top=document.querySelector('.top');
  headBottom = top ? top.getBoundingClientRect().bottom : 70;
  document.documentElement.style.setProperty('--it', Math.round(headBottom)+'px');
  docMax = Math.max(1, document.documentElement.scrollHeight - innerHeight);
  blocks = [...main.children].map(el=>{
    const card = !/,\s*0\)$|transparent/.test(getComputedStyle(el).backgroundColor);
    el.classList.add('dk', card ? 'card' : 'txt');
    let t=0, n=el; while (n){ t+=n.offsetTop; n=n.offsetParent; }
    const h=el.offsetHeight;
    el.style.setProperty('--lag', Math.round(.92*Math.min(330, h))+'px');
    return { el, t, h, card, last:'' };
  });
}
window.addEventListener('resize', ()=>{ tagBlocks(); queueFx(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ tagBlocks(); queueFx(); });
function scrollFx(){
  sfxQueued=false;
  const vh=innerHeight, y=scrollY;
  const top=document.querySelector('.top'); if (top && top.classList.contains('small') !== (y>24)) top.classList.toggle('small', y>24);
  if (CSS_SCROLL || reduce) return;
  const pr=document.getElementById('sprog'); if (pr) pr.style.transform=`scaleX(${Math.min(1,y/docMax).toFixed(4)})`;
  const headH = headBottom, footH = vh - 78, span = Math.max(240, footH - headH);
  const fTop = Math.min(1, y/120), fBot = Math.min(1, (docMax - y)/120); // at the very top/bottom nothing stays shrunk
  for (const b of blocks){
    const el=b.el, h=b.h, rt=b.t-y, rb=rt+h, card=b.card?'1':'0';
    // 1 = still below the screen, 0 = settled. Takes the bottom 40% of the screen to come in.
    const inn = Math.min(1, Math.max(0, (rt - (vh - span*.62)) / (span*.62))) * fBot;
    // 0 = fully visible, 1 = gone under the header. Starts only when its bottom edge is near the top,
    // so long lists stay put while you use them.
    const band = Math.min(span*.7, Math.max(170, h));
    const out = rt < headH ? Math.min(1, Math.max(0, (headH + band - rb) / band)) * fTop : 0;
    if (inn < .002 && out < .002){ if (b.last){ el.style.transform=''; el.style.opacity=''; b.last=''; } continue; }
    let ty, sc, op;
    if (inn >= out){ ty = inn*240; sc = 1 - inn*.34; op = 1 - inn*.95; }
    else if (card==='1'){ ty = out*Math.min(band, h)*.92; sc = 1 - out*.36; op = 1 - out*.92; }
    else { ty = -out*70; sc = 1 - out*.2; op = 1 - out; }
    const tf = `translate3d(0,${ty.toFixed(1)}px,0) scale(${sc.toFixed(4)})`;
    if (tf !== b.last){ el.style.transform = tf; el.style.opacity = Math.max(.08, op).toFixed(3); b.last = tf; }
  }
}
const queueFx=()=>{ if(!sfxQueued){ sfxQueued=true; requestAnimationFrame(scrollFx); } };
window.addEventListener('scroll', queueFx, {passive:true});

function postRender(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.ringfg[data-da]').forEach(c=>{ c.style.strokeDasharray=c.dataset.da; });
    document.querySelectorAll('.xpbar i[data-w]').forEach(i=>{ i.style.width=i.dataset.w+'%'; });

    if (from===to || reduce){ el.textContent=to+suf; return; }
    const t0=performance.now();
    setTimeout(()=>{ if(el.isConnected) el.textContent=to+suf; },900); // lands on the real number even if frames are paused
    (function step(t){ if(!el.isConnected) return; const p=Math.min(1,Math.max(0,(t-t0)/600)), e=1-Math.pow(1-p,3); el.textContent=Math.round(from+(to-from)*e)+suf; if(p<1) requestAnimationFrame(step); })(t0);
  });

const VAPID_PUBLIC = 'BNkN9QIx7dnE6C_mGR82UCF2mKmspy4HRWd0LnPY68xWL4BCp71CuiXqXXK5uFLwd082NyxHaFGcp3fmZPmgi1k';
const b64u = s => { const p='='.repeat((4-s.length%4)%4); const raw=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(raw, c=>c.charCodeAt(0)); };

let drag=null, lp=null, suppressClick=0;
function dragStart(row, y){
  if (!row || S.editing) return;
  const rows=[...document.querySelectorAll('#hlist .hrow')];
  const from=rows.indexOf(row); if (from<0) return;
  drag={row,rows,from,to:from,y0:y,step:row.offsetHeight};
  row.classList.add('drag');
  if (navigator.vibrate) try { navigator.vibrate(15); } catch(e){}
}
function dragMove(y){
  const d=drag, dy=y-d.y0;
  d.row.style.transform=`translateY(${dy}px)`;
  const to=Math.max(0,Math.min(d.rows.length-1,d.from+Math.round(dy/d.step))); d.to=to;
  d.rows.forEach((r,i)=>{ if(i===d.from) return; let s=0;
    if (d.from<to && i>d.from && i<=to) s=-d.step; else if (to<d.from && i>=to && i<d.from) s=d.step;
    r.style.transform = s ? `translateY(${s}px)` : ''; });
}
function dragEnd(){
  const d=drag; drag=null; suppressClick=Date.now()+400;
  if (d.to!==d.from){ const hs=S.habits.slice(); const [m]=hs.splice(d.from,1); hs.splice(d.to,0,m); S.habits=hs; save(); }
  render();

    const name=document.getElementById('h-name').value.trim(); if(!name) return;
    const type=document.getElementById('h-type').value, target=Math.min(7,Math.max(1,parseInt(document.getElementById('h-target').value)||1));
    const id=(name.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,20)||'habito')+'-'+Math.random().toString(36).slice(2,6);
    S.habits=S.habits.concat(type==='weekly'?{id,name,type,target}:{id,name,type}); document.getElementById('h-name').value='';
    save(); render(); toast(`${name} añadido`);
  }
});
window.addEventListener('hashchange',()=>{ const t=location.hash.slice(1); if(TABS.includes(t)){ if(S.tab!==t) S.enter=true; S.tab=t; render(); } });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ if(S.sel>todayK()) S.sel=todayK(); render(); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e=>{ if(e.data && e.data.tab && TABS.includes(e.data.tab)){ S.tab=e.data.tab; S.sheet=null; render(); } });
window.addEventListener('storage', e=>{ if(e.key===KEY){ load(); render(); } });

/* ---------- boot ---------- */
const t=location.hash.slice(1); if(TABS.includes(t)) S.tab=t;
load();
if (!S.pushTz){ S.pushTz='America/Costa_Rica'; save(); } // the code saved on GitHub on 15/11/2026 was made in Costa Rica
applyTheme(); render(); mirror(); refreshPush();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if ('serviceWorker' in navigator) window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
