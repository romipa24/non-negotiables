<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Non Negotiables</title>
<meta name="theme-color" content="#0A0B0D">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Non Neg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Sticky top bar, three views, fixed bottom tabs.
   Gunmetal panels; burnished bronze marks what is done and what is a record. */
:root{
  --bg:#0A0B0D; --panel:#121418; --panel-2:#181B20; --line:#23272E; --line-2:#343943;
  --fg:#ECE8E1; --muted:#8C919A; --dim:#5A5F69;
  --bronze:#C9883B; --bronze-hi:#EDB36A; --bronze-lo:#2E2215;
  --good:#7FB685; --bad:#C2553F;
  --f-display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg);margin:0}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(130% 50% at 50% -8%,rgba(201,136,59,.13),transparent 62%),var(--bg);
  background-attachment:fixed;min-height:100vh;overscroll-behavior-y:none;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--bronze-hi);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px;background:linear-gradient(var(--bg) 70%,transparent)}
.brand{font-family:var(--f-display);font-size:26px;letter-spacing:.06em;line-height:1}
.brand span{color:var(--bronze)}

.view{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.h-display{font-family:var(--f-display);font-weight:400;letter-spacing:.03em;line-height:.95;margin:0;text-wrap:balance}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head h2{font-family:var(--f-display);font-size:22px;letter-spacing:.06em;font-weight:400;margin:0}
.muted{color:var(--muted)}

.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:6px}
.dayhead h1{font-size:clamp(44px,13vw,60px)}
.daynav{display:flex;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--fg);background:var(--panel)}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.chip.lv-weak{color:var(--bad);border-color:rgba(194,85,63,.45)}
.chip.lv-solid{color:var(--fg);border-color:var(--line-2)}
.chip.lv-elite{color:var(--bronze-hi);border-color:rgba(237,179,106,.5);background:var(--bronze-lo)}
.linkbtn{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--bronze-hi);padding:6px 0}

.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:112px;height:112px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1}
.ring .val small{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.score-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.kv b{font-family:var(--f-num);font-size:22px;font-weight:600}

.habits{display:flex;flex-direction:column;gap:8px}
.habit{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);transition:background .15s,border-color .15s}
.habit .box{width:30px;height:30px;border-radius:8px;border:2px solid var(--line-2);display:grid;place-items:center;transition:all .15s}
.habit .box svg{width:18px;height:18px;opacity:0;color:#16110A;transition:opacity .15s}
.habit.on{background:linear-gradient(90deg,rgba(201,136,59,.12),rgba(201,136,59,.03));border-color:rgba(201,136,59,.35)}
.habit.on .box{background:var(--bronze);border-color:var(--bronze)}
.habit.on .box svg{opacity:1}
.habit .name{font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.habit .sub{font-size:12px;color:var(--muted)}
.habit .streak{display:flex;align-items:center;gap:4px;font-family:var(--f-num);font-size:18px;font-weight:600;color:var(--muted)}
.habit .streak svg{width:15px;height:15px}
.habit.on .streak{color:var(--bronze-hi)}
.editbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--bronze-hi);padding:8px 12px;border-radius:999px;border:1px solid rgba(237,179,106,.4)}
.editbtn svg{width:14px;height:14px}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;border:1px dashed var(--line-2);color:var(--muted);font-weight:600;font-size:14px;letter-spacing:.04em}
.addrow svg{width:16px;height:16px}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;border:1px dashed rgba(237,179,106,.5);background:var(--bronze-lo);color:var(--bronze-hi);font-weight:600;font-size:14px}
.banner button{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:8px 12px;border-radius:8px;background:var(--bronze);color:#16110A;white-space:nowrap}

.wgrid{display:grid;grid-template-columns:minmax(60px,1.5fr) repeat(7,minmax(22px,1fr)) 40px;gap:5px;align-items:center}
.wgrid .hd{font-size:11px;font-weight:700;color:var(--dim);text-align:center;letter-spacing:.06em}
.wgrid .hd.today{color:var(--bronze-hi)}
.wgrid .lbl{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wgrid .pc{font-family:var(--f-num);font-size:14px;text-align:right;color:var(--muted)}
.cell{aspect-ratio:1;max-width:100%;border-radius:6px;background:#1E2127;border:1px solid var(--line)}
.cell.on{background:var(--bronze);border-color:var(--bronze)}
.cell.fut{opacity:.35;cursor:default}
.cell.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--muted)}
.wfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);gap:10px}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}

.hero{position:relative;overflow:hidden;padding:20px 18px;border-radius:16px;border:1px solid rgba(201,136,59,.35);background:radial-gradient(90% 120% at 100% 0%,rgba(201,136,59,.22),transparent 60%),var(--panel)}
.hero .big{font-family:var(--f-display);font-size:96px;line-height:.85;color:var(--bronze-hi)}
.hero .unit{font-family:var(--f-display);font-size:26px;letter-spacing:.06em;color:var(--fg)}
.hero .flame{position:absolute;right:-10px;bottom:-18px;width:150px;height:150px;color:var(--bronze);opacity:.13}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.scard.rec{border-color:rgba(201,136,59,.45)}
.scard .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scard .t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.badge{font-size:9px;font-weight:700;letter-spacing:.14em;padding:3px 7px;border-radius:999px;background:var(--bronze);color:#16110A;white-space:nowrap}
.scard .n{display:flex;align-items:baseline;gap:6px}
.scard .n b{font-family:var(--f-display);font-size:54px;line-height:.9}
.scard .n span{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.bar{height:6px;border-radius:3px;background:#1E2127;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bronze),var(--bronze-hi));border-radius:3px}
.best{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.best svg{width:14px;height:14px;color:var(--bronze)}
.best b{font-family:var(--f-num);font-size:15px;color:var(--fg)}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.dots.w{grid-template-columns:repeat(8,1fr)}
.dots i{height:8px;border-radius:2px;background:#1E2127}
.dots i.on{background:var(--bronze)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--f-num);font-size:28px;font-weight:600;line-height:1.1}
.stat b.up{color:var(--good)} .stat b.down{color:var(--bad)}
.stat span{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{width:100%;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:12px}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:90px;resize:vertical}
input.kg{font-family:var(--f-num);font-size:24px;font-weight:600;padding:8px 12px}
.btn{width:100%;padding:14px;border-radius:10px;background:var(--bronze);color:#16110A;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line-2)}
.btn.danger{background:var(--bad);color:#fff}
.span2{grid-column:1/-1}
.log{display:flex;flex-direction:column}
.log .row{display:grid;grid-template-columns:1fr auto auto 36px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.log .row:last-child{border-bottom:0}
.log .d{font-weight:600}
.log .d small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.log .kgv{font-family:var(--f-num);font-size:20px;font-weight:600}
.log .dl{font-family:var(--f-num);font-size:14px;min-width:48px;text-align:right}
.log .dl.up{color:var(--good)} .log .dl.down{color:var(--bad)} .log .dl.flat{color:var(--dim)}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--dim)}
.x svg{width:14px;height:14px}
.x.armed{background:var(--bad);color:#fff}

.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:24px;letter-spacing:.05em;font-weight:400;margin-bottom:4px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,11,13,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 12px;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--bronze-hi)}
.tab.on::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--bronze-hi);border-radius:0 0 2px 2px}

.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:540px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-bottom:0;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.hlist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:32px 1fr 36px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);background:var(--panel);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .18s ease}
.hrow.drag{transition:none;position:relative;z-index:2;background:var(--panel-2);border-radius:10px;border-color:transparent;box-shadow:0 12px 28px rgba(0,0,0,.55),0 0 0 1px rgba(237,179,106,.45)}
.hrow.drag .grip{color:var(--bronze-hi)}
.grip{height:44px;display:grid;place-items:center;color:var(--dim);touch-action:none;cursor:grab}
.grip svg{width:16px;height:16px}
.hname{text-align:left;min-width:0;padding:6px 4px;display:flex;flex-direction:column}
.hname b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hname small{font-size:12px;color:var(--muted)}
.hedit{padding:12px;margin:6px 0;border-radius:12px;border:1px solid rgba(237,179,106,.45);background:var(--panel-2)}
.hedit .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:13px;color:var(--muted);margin:0}
.note.warn{color:var(--bronze-hi)}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);font-weight:600;font-size:13px;padding:10px 16px;border-radius:999px;max-width:calc(100% - 32px);text-align:center}
/* ---------- feel: press feedback, motion, XP, celebrations ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.habit,.btn,.tab,.iconbtn,.cell,.editbtn,.addrow{transition:transform .12s ease,background .15s,border-color .15s}
.habit:active{transform:scale(.975)}
.btn:active,.editbtn:active,.addrow:active{transform:scale(.97)}
.iconbtn:active,.tab:active{transform:scale(.9)}
.cell:active{transform:scale(.8)}
.habit{position:relative;overflow:hidden}
.habit.just::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,226,176,.3) 50%,transparent 70%);transform:translateX(-100%);animation:shine .6s ease-out}
@keyframes shine{to{transform:translateX(100%)}}
.habit.just .streak{animation:bump .45s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.habit.on .streak svg,.hero .flame svg{animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(3deg)}}
.cell.on:not(.sel){box-shadow:0 0 10px rgba(201,136,59,.35)}
.ringfg{transition:stroke-dasharray .7s cubic-bezier(.2,.8,.2,1)}
.ring.perfect svg{filter:drop-shadow(0 0 10px rgba(237,179,106,.65))}
.ring.perfect .val b{color:var(--bronze-hi)}
.xp{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.xp-lv{width:46px;height:46px;display:grid;place-items:center;background:linear-gradient(145deg,var(--bronze-hi),var(--bronze));color:#16110A;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.xp-lv b{font-size:22px;font-weight:700}
.xp-main{min-width:0;display:flex;flex-direction:column;gap:6px}
.xp-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.xp-rank{font-family:var(--f-display);font-size:20px;letter-spacing:.08em}
.xp-n{font-size:13px;color:var(--muted)}
.xpbar{height:8px;border-radius:4px;background:#1E2127;overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--bronze),var(--bronze-hi));transition:width .7s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(237,179,106,.5)}
.score-msg{grid-column:1/-1;margin:0;font-size:13px;font-weight:600;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.score-msg.ok{color:var(--bronze-hi)}
.floatxp{position:fixed;z-index:61;pointer-events:none;font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--bronze-hi);transform:translate(-50%,-50%);animation:floatup .9s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.6)}
@keyframes floatup{to{transform:translate(-50%,-90px);opacity:0}}
.flash{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:55;transform:translateX(-50%);width:min(calc(100% - 24px),500px);display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--panel-2);border:1px solid rgba(237,179,106,.55);box-shadow:0 14px 40px rgba(0,0,0,.6)}
.flash.show{animation:flashin 3.2s ease both}
@keyframes flashin{0%{transform:translate(-50%,-140%)}8%{transform:translate(-50%,6px)}12%,88%{transform:translate(-50%,0)}100%{transform:translate(-50%,-140%)}}
.flash .fi{font-size:26px}
.flash b{display:block;font-family:var(--f-display);font-size:20px;letter-spacing:.05em;font-weight:400;color:var(--bronze-hi)}
.flash small{color:var(--muted);font-size:13px}
.celebrate{position:fixed;inset:0;z-index:58;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(80% 55% at 50% 45%,rgba(201,136,59,.3),transparent 70%),rgba(10,11,13,.94);cursor:pointer}
.celebrate.show{animation:fadein .25s ease both}
.cel-k{font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.cel-t{font-family:var(--f-display);font-size:clamp(64px,20vw,110px);line-height:.9;color:var(--bronze-hi);margin:10px 0;text-shadow:0 0 40px rgba(237,179,106,.5);animation:slam .5s cubic-bezier(.2,1.4,.3,1) both}
.cel-s{font-size:16px;font-weight:600;text-wrap:balance}
.cel-x{margin-top:28px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
@keyframes slam{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fadein{from{opacity:0}}
.view.enter>*{animation:rise .38s ease-out both}
.view.enter>*:nth-child(2){animation-delay:.04s}
.view.enter>*:nth-child(3){animation-delay:.08s}
.view.enter>*:nth-child(4){animation-delay:.12s}
.view.enter>*:nth-child(5){animation-delay:.16s}
.view.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.enter .wline{stroke-dasharray:1;animation:draw 1.1s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.enter .bar30{transform-box:fill-box;transform-origin:50% 100%;animation:grow .5s ease-out both}
@keyframes grow{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.habit.on.just .box{animation:pop .28s ease-out}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">NON <span>NEGOTIABLES</span></div>
    <button class="iconbtn" data-act="sheet" data-sheet="backup" aria-label="Ajustes" id="gear"></button>
  </header>
  <main id="main" class="view"></main>
</div>
<div class="tabs"><nav id="tabs"></nav></div>
<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>
<div id="flash" class="flash" hidden></div>
<div id="celebrate" class="celebrate" hidden></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
const I = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.6 2.2c.5 3.1 2.4 4.9 3.9 6.6 1.5 1.7 2.5 3.4 2.5 5.7A7 7 0 0 1 12 21.5a7 7 0 0 1-7-7c0-2.7 1.3-4.6 2.9-6 .2 1.7.9 3 2.1 3.8-.3-3.6.6-7.4 2.6-10.1z"/></svg>',
  crown:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-1.8 11H4.8z"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5" fill="currentColor"/></svg>',
  dumbbell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6v12M17.5 6v12M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>',
};

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; };
const monday = d => addDays(d, -((d.getDay()+6)%7));
const todayK = () => key(new Date());
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const INI = ['L','M','X','J','V','S','D'];
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtShort = k => { const d = parse(k); return `${d.getDate()} ${MES[d.getMonth()]}`; };
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Weights keep grams (up to 3 decimals). Shown with a comma, at least one decimal: 72,3 · 72,35 · 72,355
const kgf = v => { let s = (Math.round(v*1000)/1000).toFixed(3).replace(/0{1,2}$/,''); return s.replace('.',','); };
// Accepts "72,35", "72.35", "72 350" or "72,350 kg"; returns kg or NaN.
const parseKg = raw => { const s=String(raw||'').trim().toLowerCase().replace(/kg/g,'').replace(/\s+/g,'').replace(',','.'); return /^\d{1,3}(\.\d{1,3})?$/.test(s) ? Math.round(parseFloat(s)*1000)/1000 : NaN; };

/* ---------- state, saved on this phone ---------- */
const KEY = 'nn-data-v1';
const S = { habits:[], goal:null, days:{}, weights:[], records:{}, lastBackup:null, sound:true, sel:todayK(), tab:'hoy', sheet:null, armed:null, just:null, enter:true };
const P = { ring:0, xp:0 }; // last drawn values, so the ring and the XP bar animate from where they were
function load(){
  try { const d = JSON.parse(localStorage.getItem(KEY)||'null'); if (d) apply(d); } catch(e){}
}
function apply(d){
  S.habits = Array.isArray(d.habits) ? d.habits : [];
  S.goal = typeof d.goal==='number' ? d.goal : null;
  S.days = d.days && typeof d.days==='object' ? d.days : {};
  S.weights = Array.isArray(d.weights) ? d.weights.filter(w=>w && w.date && w.kg>0).sort((a,b)=>a.date<b.date?-1:1) : [];
  S.records = d.records && typeof d.records==='object' ? d.records : {};
  if (d.lastBackup) S.lastBackup = d.lastBackup;
  S.sound = d.sound !== false;
}
const snapshot = () => ({ app:'non-negotiables', v:1, habits:S.habits, goal:S.goal, days:S.days, weights:S.weights, records:S.records, lastBackup:S.lastBackup, sound:S.sound });
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(snapshot())); }
  catch(e){ toast('No se ha podido guardar en el móvil. ¿Queda espacio libre?'); }
  mirror();
}

/* ---------- maths ---------- */
const doneOn = (k,id) => !!(S.days[k] && S.days[k][id]);
function weekCount(h, w){ let c=0; for (let i=0;i<7;i++) if (doneOn(key(addDays(w,i)),h.id)) c++; return c; }
function streak(h){
  const tK = todayK(), t = parse(tK);
  const keys = Object.keys(S.days).filter(k => S.days[k][h.id] && k <= tK).sort();
  let run=0, best=0;
  if (keys.length){
    if (h.type==='weekly'){
      const end = monday(t), endK = key(end);
      for (let w = monday(parse(keys[0])); w <= end; w = addDays(w,7)){
        if (weekCount(h,w) >= h.target){ run++; best=Math.max(best,run); }
        else if (key(w)!==endK) run=0;
      }
    } else {
      for (let d = parse(keys[0]); d <= t; d = addDays(d,1)){
        const k = key(d);
        if (doneOn(k,h.id)){ run++; best=Math.max(best,run); }
        else if (k!==tK) run=0;
      }
    }
  }
  return { cur:run, computed:best, best:Math.max(best, S.records[h.id]||0) };
}
// A day is perfect when every daily habit is done. A weekly habit (gym 4×) counts on the days it is done
// and never holds a rest day back from 100%.
function dayStats(k){
  let done=0, total=0, left=0;
  S.habits.forEach(h => { const on=doneOn(k,h.id);
    if (h.type==='weekly'){ if (on){ done++; total++; } }
    else { total++; if (on) done++; else left++; } });
  return { done, total, left, pct: total ? done/total : 0, perfect: total>0 && left===0 && done>0 };
}
const dayPct = k => dayStats(k).pct;
function perfectRun(k){ let n=0; for (let d=parse(k); n<3660 && dayStats(key(d)).perfect; d=addDays(d,-1)) n++; return n; }

/* ---------- XP and levels, always derived from the history ---------- */
const RANKS = [[1,'RECLUTA'],[3,'SOLDADO'],[5,'GUERRERO'],[8,'GLADIADOR'],[12,'ESPARTANO'],[16,'TITÁN'],[20,'LEYENDA'],[30,'INQUEBRANTABLE']];
function xpTotal(){
  let xp=0; const ids=new Set(S.habits.map(h=>h.id));
  for (const k in S.days){ let c=0; for (const id in S.days[k]) if (ids.has(id)) c++; xp += c*10; if (c && dayStats(k).perfect) xp += 50; }
  return xp + S.weights.length*20;
}
function levelInfo(){
  const xp=xpTotal(); let lv=1; while (75*lv*(lv+1) <= xp) lv++;
  const base=75*(lv-1)*lv, need=150*lv;
  return { xp, lv, cur:xp-base, need, pct:(xp-base)/need, rank:RANKS.filter(r=>r[0]<=lv).pop()[1] };
}

/* ---------- effects: particles, sound, banners ---------- */
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const fx = document.getElementById('fx'), fctx = fx.getContext('2d'); let parts=[], fxRun=false;
function fxSize(){ const d=Math.min(window.devicePixelRatio||1,2); fx.width=innerWidth*d; fx.height=innerHeight*d; fctx.setTransform(d,0,0,d,0,0); }
window.addEventListener('resize', fxSize); fxSize();
const COLS = ['#EDB36A','#C9883B','#FFE2B0','#ECE8E1','#8A5A22'];
function spawn(x, y, n, o={}){
  if (reduce) return;
  for (let i=0;i<n;i++){
    const a=(o.angle??-Math.PI/2)+(Math.random()-.5)*(o.spread??Math.PI*2), sp=(o.speed??7)*(.35+Math.random()*.9);
    parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, g:o.gravity??.32, life:1, decay:(o.decay??.02)*(.7+Math.random()*.6), s:(o.size??5)*(.6+Math.random()*.8), c:COLS[(Math.random()*COLS.length)|0], r:Math.random()*6.28, vr:(Math.random()-.5)*.4, sq:Math.random()<.6 });
  }
  if (!fxRun){ fxRun=true; requestAnimationFrame(fxTick); }
}
function fxTick(){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p => p.life>0 && p.y<innerHeight+40);
  for (const p of parts){
    p.vx*=.985; p.vy=p.vy*.985+p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=p.decay;
    fctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6)); fctx.fillStyle=p.c;
    if (p.sq){ fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.r); fctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); fctx.restore(); }
    else { fctx.beginPath(); fctx.arc(p.x,p.y,p.s/2,0,6.28); fctx.fill(); }
  }
  fctx.globalAlpha=1;
  if (parts.length) requestAnimationFrame(fxTick); else fxRun=false;
}
function rain(n){
  for (let i=0;i<n;i++) setTimeout(()=>spawn(Math.random()*innerWidth,-10,1,{angle:Math.PI/2,spread:.8,speed:5,gravity:.12,decay:.008,size:8}), Math.random()*900);
  spawn(innerWidth*.08,innerHeight*.78,45,{angle:-1.1,spread:.9,speed:17,decay:.012,size:7});
  spawn(innerWidth*.92,innerHeight*.78,45,{angle:-2.04,spread:.9,speed:17,decay:.012,size:7});
}
let actx=null;
function tone(f, t0, dur, type='triangle', vol=.16){
  const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+.03);
}
const SCALE = [523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1568,1760];
function sfx(name, n=0){
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if (actx.state==='suspended') actx.resume();
    const t=actx.currentTime+.01;
    if (name==='check'){ const f=SCALE[Math.max(0,Math.min(n,SCALE.length-1))]; tone(f,t,.16); tone(f*2,t+.05,.2,'sine',.08); } // climbs with each habit of the day
    else if (name==='uncheck') tone(220,t,.12,'sine',.1);
    else if (name==='tap') tone(660,t,.05,'sine',.04);
    else if (name==='coin'){ tone(987.77,t,.09,'square',.06); tone(1318.5,t+.08,.3,'square',.06); }
    else if (name==='milestone') [659.25,880,1318.5].forEach((f,i)=>tone(f,t+i*.08,.3,'triangle',.12));
    else if (name==='perfect'){ [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,t+i*.09,.35,'triangle',.14)); tone(1046.5,t+.5,.9,'sine',.12); tone(1568,t+.5,.9,'sine',.08); }
    else if (name==='level'){ [392,523.25,659.25,783.99,1046.5,1318.5,1568].forEach((f,i)=>tone(f,t+i*.07,.4,'sawtooth',.05)); tone(2093,t+.55,1,'sine',.1); }
  } catch(e){}
}
function floatText(x, y, txt){
  const el=document.createElement('div'); el.className='floatxp'; el.textContent=txt; el.style.left=x+'px'; el.style.top=y+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),1000);
}
let flashT;
function flash(icon, title, sub){
  const f=document.getElementById('flash');
  f.innerHTML=`<span class="fi">${icon}</span><span><b>${esc(title)}</b><small>${esc(sub)}</small></span>`;
  f.hidden=false; f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
  clearTimeout(flashT); flashT=setTimeout(()=>{ f.hidden=true; },3200);
}
const celQ=[]; let celOn=false, celT;
function celebrate(c){ celQ.push(c); if (!celOn) nextCel(); }
function nextCel(){
  const el=document.getElementById('celebrate'), c=celQ.shift();
  if (!c){ celOn=false; el.hidden=true; return; }
  celOn=true;
  el.innerHTML=`<div><div class="cel-k">${esc(c.kicker)}</div><div class="cel-t">${esc(c.title)}</div><div class="cel-s">${esc(c.sub)}</div><div class="cel-x">Toca para seguir</div></div>`;
  el.hidden=false; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  sfx(c.sound||'perfect'); rain(150);
  clearTimeout(celT); celT=setTimeout(nextCel,3600);
}
document.getElementById('celebrate').addEventListener('click',()=>{ clearTimeout(celT); nextCel(); });
function weekScore(w){
  if (!S.habits.length) return 0;
  const tK = todayK(); const isCur = key(monday(parse(tK)))===key(w);
  const elapsed = isCur ? ((parse(tK).getDay()+6)%7)+1 : 7;
  let sum = 0;
  S.habits.forEach(h => { const c = weekCount(h,w); sum += h.type==='weekly' ? Math.min(c/h.target,1) : Math.min(c/elapsed,1); });
  return sum / S.habits.length;
}
const level = s => s < .6 ? ['WEAK','lv-weak'] : s < .85 ? ['SOLID','lv-solid'] : ['ELITE','lv-elite'];
const pct = v => Math.round(v*100) + '%';
function syncRecords(){
  S.habits.forEach(h => { const s = streak(h); if (s.computed > (S.records[h.id]||0)) S.records[h.id]=s.computed; });
}

/* ---------- actions ---------- */
function toggle(k, id, el){
  if (k > todayK()) return;
  const h = S.habits.find(x=>x.id===id); if (!h) return;
  const before = { lv:levelInfo().lv, st:streak(h), perfect:dayStats(k).perfect };
  const cur = {...(S.days[k]||{})};
  const on = !cur[id];
  if (on){ cur[id] = true; S.just = k+'|'+id; } else delete cur[id];
  if (Object.keys(cur).length) S.days[k] = cur; else delete S.days[k];
  syncRecords(); save();
  const r = el && el.getBoundingClientRect(), x = r ? r.left+r.width/2 : innerWidth/2, y = r ? r.top+r.height/2 : innerHeight/2;
  render();
  if (!on){ sfx('uncheck'); return; }
  if (navigator.vibrate) try { navigator.vibrate(12); } catch(e){}
  const ds = dayStats(k), lv = levelInfo(), st = streak(h), unit = h.type==='weekly' ? 'semanas' : 'días';
  spawn(x, y, 18, { speed:6, decay:.03, size:5 });
  floatText(x, y, '+10 XP');
  const nowPerfect = ds.perfect && !before.perfect;
  if (nowPerfect){
    const run = perfectRun(k);
    celebrate({ kicker:k===todayK()?'Hoy':fmtShort(k), title:'DÍA PERFECTO', sub:`${ds.done}/${ds.total} hechos · +50 XP${run>1?` · ${run} días perfectos seguidos`:''}`, sound:'perfect' });
  } else sfx('check', ds.done-1);
  if (lv.lv > before.lv) celebrate({ kicker:'Subes de nivel', title:'NIVEL '+lv.lv, sub:lv.rank, sound:'level' });
  if (st.cur > before.st.best && st.cur >= 2){ flash('👑', 'Nuevo récord · '+h.name, `${st.cur} ${unit} seguidos`); if (!nowPerfect) sfx('milestone'); }
  else if (st.cur > before.st.cur && [3,7,14,21,30,50,75,100,150,200,300,365].includes(st.cur)){ flash('🔥', `${st.cur} ${unit} · ${h.name}`, 'Racha en marcha. No la sueltes.'); if (!nowPerfect) sfx('milestone'); }
}
function arm(id, fn){
  if (S.armed===id){ S.armed=null; fn(); return; }
  S.armed=id; render(); clearTimeout(arm.t); arm.t=setTimeout(()=>{ if(S.armed===id){ S.armed=null; render(); } },3000);
}
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

/* ---------- charts ---------- */
function ring(v){
  const r=46, c=2*Math.PI*r;
  return `<svg viewBox="0 0 112 112"><circle cx="56" cy="56" r="${r}" fill="none" stroke="#1E2127" stroke-width="10"/><circle class="ringfg" cx="56" cy="56" r="${r}" fill="none" stroke="var(--bronze)" stroke-width="10" stroke-linecap="round" data-da="${(c*v).toFixed(1)} ${c.toFixed(1)}" style="stroke-dasharray:${(c*P.ring).toFixed(1)} ${c.toFixed(1)}"/></svg>`;
}
function barsChart(){
  const W=340,H=120,L=30,R=4,T=8,B=22, n=30, t=parse(todayK());
  const cw=(W-L-R)/n, ih=H-T-B;
  let g='';
  [0,.5,1].forEach(v=>{ const y=T+ih*(1-v); g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${v*100}%</text>`; });
  for (let i=0;i<n;i++){
    const d=addDays(t,i-n+1), k=key(d), v=dayPct(k), h=Math.max(v*ih, v>0?2:0);
    const x=L+i*cw+1.5, op=v>=.85?1:v>=.6?.7:.4;
    g+=`<rect x="${x.toFixed(1)}" y="${(T+ih-h).toFixed(1)}" width="${(cw-3).toFixed(1)}" height="${h.toFixed(1)}" rx="2" class="bar30" style="animation-delay:${i*12}ms" fill="var(--bronze)" fill-opacity="${op}"><title>${fmtShort(k)}: ${pct(v)}</title></rect>`;
    if (d.getDay()===1) g+=`<text x="${(x+(cw-3)/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${d.getDate()}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumplimiento diario de los últimos 30 días">${g}</svg>`;
}
function weightChart(){
  const ws=S.weights; const W=340,H=210,L=38,R=16,T=18,B=26;
  if (!ws.length) return '';
  const xs=ws.map(w=>parse(w.date).getTime()); let x0=Math.min(...xs), x1=Math.max(...xs);
  if (x0===x1){ x0-=3.5*864e5; x1+=3.5*864e5; }
  const vals=ws.map(w=>w.kg).concat(S.goal?[S.goal]:[]);
  const span=Math.max(...vals)-Math.min(...vals);
  const step=[.5,1,2,5,10].find(s=>(span+1)/s<=5)||10;
  const lo=Math.floor((Math.min(...vals)-step*.5)/step)*step, hi=Math.ceil((Math.max(...vals)+step*.5)/step)*step;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g='';
  for (let v=lo; v<=hi+1e-9; v+=step){ const y=Y(v); g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${L-6}" y="${(y+4).toFixed(1)}" text-anchor="end">${Number.isInteger(v)?v:v.toFixed(1)}</text>`; }
  if (S.goal){ const y=Y(S.goal); g+=`<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W-R}" y="${(y-6).toFixed(1)}" text-anchor="end" style="fill:var(--good)">OBJETIVO ${kgf(S.goal)}</text>`; }
  const pts=ws.map(w=>[X(parse(w.date).getTime()),Y(w.kg)]);
  if (pts.length>1){
    const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    g+=`<path d="${line} L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z" fill="url(#wg)"/>`;
    g+=`<path class="wline" pathLength="1" d="${line}" fill="none" stroke="var(--bronze-hi)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach((p,i)=>{ const last=i===pts.length-1; g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last?5.5:3}" fill="${last?'var(--bronze-hi)':'var(--bg)'}" stroke="var(--bronze-hi)" stroke-width="2"><title>${fmtShort(ws[i].date)}: ${kgf(ws[i].kg)} kg</title></circle>`; });
  const lp=pts[pts.length-1];
  g+=`<text x="${Math.min(lp[0],W-R-2).toFixed(1)}" y="${(lp[1]-12).toFixed(1)}" text-anchor="${lp[0]>W-60?'end':'middle'}" style="fill:var(--fg);font-size:13px;font-weight:600">${kgf(ws[ws.length-1].kg)} kg</text>`;
  g+=`<text x="${L}" y="${H-6}">${fmtShort(ws[0].date)}</text>`;
  if (ws.length>1) g+=`<text x="${W-R}" y="${H-6}" text-anchor="end">${fmtShort(ws[ws.length-1].date)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9883B" stop-opacity=".35"/><stop offset="1" stop-color="#C9883B" stop-opacity="0"/></linearGradient></defs>${g}</svg>`;
}

function mondayBanner(){

}

function viewRachas(){
  let h = `<section class="dayhead"><div><div class="eyebrow">Días seguidos sin fallar</div><h1 class="h-display">Rachas</h1></div><button class="linkbtn" data-act="sheet" data-sheet="habits">Editar hábitos</button></section>`;

  const daily=all.filter(a=>a.x.type!=='weekly').sort((a,b)=>b.s.cur-a.s.cur);
  const top=daily[0]||all[0];
  h += `<section class="hero"><div class="flame">${I.flame}</div><div class="eyebrow">Racha más larga activa · ${esc(top.x.name)}</div>

    body = isStandalone
      ? `<p class="note warn">Este móvil no admite avisos. En iPhone hace falta iOS 16.4 o superior.</p>`
      : `<p class="note warn">Para activar los avisos, abre la app desde su icono en la pantalla de inicio.</p>`;
  } else if (Notification.permission === 'denied'){

/* ---------- render ---------- */
function render(){
  const keep={}; ['w-kg','w-date','goal','h-name','h-type','h-target','e-name','e-type','e-target','imp-text'].forEach(id=>{ const el=document.getElementById(id); if(el) keep[id]=el.value; });
  const act=document.activeElement && document.activeElement.id;
  const fileInput=document.getElementById('imp-file'); const files=fileInput && fileInput.files;
  const main=document.getElementById('main');
  main.innerHTML = S.tab==='rachas' ? viewRachas() : S.tab==='peso' ? viewPeso() : viewHoy();
  main.classList.toggle('enter', !!S.enter);
  document.getElementById('overlay').innerHTML = sheet();
  Object.entries(keep).forEach(([id,v])=>{ const el=document.getElementById(id); if(el) el.value=v; });
  syncTargetFields();
  if (files && files.length){ const f=document.getElementById('imp-file'); if (f) try { f.files=files; } catch(e){} }
  if (act){ const el=document.getElementById(act); if(el && el.type!=='file') el.focus(); }
  document.getElementById('tabs').innerHTML = [['hoy','Hábitos',I.grid],['rachas','Rachas',I.flame],['peso','Peso',I.dumbbell]]
    .map(([t,l,ic])=>`<button class="tab ${S.tab===t?'on':''}" data-act="tab" data-tab="${t}" aria-current="${S.tab===t?'page':'false'}">${ic}${l}</button>`).join('');
  postRender();
  S.just=null; S.enter=false;
}
// Run the ring, the XP bar and the counters from their last drawn value to the new one.
function postRender(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.ringfg[data-da]').forEach(c=>{ c.style.strokeDasharray=c.dataset.da; });
    document.querySelectorAll('.xpbar i[data-w]').forEach(i=>{ i.style.width=i.dataset.w+'%'; });
  }));
  const enter=S.enter;
  document.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count, from=el.dataset.from!==undefined ? +el.dataset.from : (enter?0:to), suf=el.dataset.suffix||'';
    if (from===to || reduce){ el.textContent=to+suf; return; }
    const t0=performance.now();
    setTimeout(()=>{ if(el.isConnected) el.textContent=to+suf; },900); // lands on the real number even if frames are paused
    (function step(t){ if(!el.isConnected) return; const p=Math.min(1,Math.max(0,(t-t0)/600)), e=1-Math.pow(1-p,3); el.textContent=Math.round(from+(to-from)*e)+suf; if(p<1) requestAnimationFrame(step); })(t0);
  });
  P.ring=dayStats(S.sel).pct; P.xp=levelInfo().pct;
}

/* ---------- backup ---------- */
async function exportBackup(){
  S.lastBackup = new Date().toISOString();
  const json = JSON.stringify(snapshot(), null, 1);
  const name = `non-negotiables-${todayK()}.json`;
  const file = new File([json], name, { type:'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'Copia Non Negotiables' });
      save(); render(); toast('Copia lista'); return;
    }
  } catch(e){ if (e && e.name==='AbortError'){ S.lastBackup=null; load(); return; } }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  save(); render(); toast('Copia descargada');
}
async function importBackup(){
  let txt = (document.getElementById('imp-text')||{}).value || '';
  const f = document.getElementById('imp-file');
  if (f && f.files && f.files[0]) txt = await f.files[0].text();
  let d;
  try { d = JSON.parse(txt); } catch(e){ toast('Ese texto no es una copia válida.'); return; }
  if (!d || d.app!=='non-negotiables' || !Array.isArray(d.habits)){ toast('Ese archivo no es una copia de Non Negotiables.'); return; }
  apply(d); syncRecords(); save(); S.sheet=null; S.sel=todayK(); render(); toast('Copia restaurada');
}

/* ---------- notifications ---------- */
const VAPID_PUBLIC = 'BNkN9QIx7dnE6C_mGR82UCF2mKmspy4HRWd0LnPY68xWL4BCp71CuiXqXXK5uFLwd082NyxHaFGcp3fmZPmgi1k';
const b64u = s => { const p='='.repeat((4-s.length%4)%4); const raw=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(raw, c=>c.charCodeAt(0)); };
const pushCode = sub => JSON.stringify({ ...sub.toJSON(), tz: Intl.DateTimeFormat().resolvedOptions().timeZone });
async function refreshPush(){
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || Notification.permission!=='granted') { S.push=null; return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    S.push = sub ? pushCode(sub) : null;
  } catch(e){ S.push=null; }
  if (S.sheet==='backup') render();
}
async function enablePush(){
  try {
    const perm = await Notification.requestPermission();
    if (perm!=='granted'){ render(); toast('Sin permiso no puedo enviarte avisos.'); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64u(VAPID_PUBLIC) });
    S.push = pushCode(sub); render(); toast('Avisos activados. Envíame el código.');
  } catch(e){ toast('No se han podido activar: '+(e && e.message || e)); }
}
async function copyPush(){
  try { await navigator.clipboard.writeText(S.push); toast('Código copiado'); }
  catch(e){ const t=document.getElementById('push-code'); if(t){ t.focus(); t.select(); } toast('Selecciona el texto y cópialo'); }
}
async function sharePush(){
  try { await navigator.share({ title:'Código Non Negotiables', text:S.push }); } catch(e){ if(!(e && e.name==='AbortError')) copyPush(); }
}
async function testPush(){
  try { const reg = await navigator.serviceWorker.ready; await reg.showNotification('⚖️ PÉSATEEE!!!! ⚖️', { body:'Así se verá el aviso del lunes 💪🔥', icon:'icons/icon-192.png', badge:'icons/icon-192.png', tag:'test' }); }
  catch(e){ toast('No se ha podido mostrar el aviso de prueba.'); }
}

/* Mirror the data into IndexedDB so the notification can say what is still missing today. */
function mirror(){
  try {
    const r = indexedDB.open('nn', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { try { r.result.transaction('kv','readwrite').objectStore('kv').put(snapshot(),'data'); } catch(e){} };
  } catch(e){}
}

/* ---------- habit editor: weekly target field, drag to reorder ---------- */
function syncTargetFields(){
  ['h-type','e-type'].forEach(id=>{ const s=document.getElementById(id); if(!s) return; const f=s.form && s.form.querySelector('.tgt'); if(f) f.hidden = s.value!=='weekly'; });
}
document.addEventListener('change', e=>{ if(e.target.id==='h-type'||e.target.id==='e-type') syncTargetFields(); });

let drag=null, lp=null, suppressClick=0;
function dragStart(row, y){
  if (!row || S.editing) return;
  const rows=[...document.querySelectorAll('#hlist .hrow')];
  const from=rows.indexOf(row); if (from<0) return;
  drag={row,rows,from,to:from,y0:y,step:row.offsetHeight};
  row.classList.add('drag');
  if (navigator.vibrate) try { navigator.vibrate(15); } catch(e){}
}
function dragMove(y){
  const d=drag, dy=y-d.y0;
  d.row.style.transform=`translateY(${dy}px)`;
  const to=Math.max(0,Math.min(d.rows.length-1,d.from+Math.round(dy/d.step))); d.to=to;
  d.rows.forEach((r,i)=>{ if(i===d.from) return; let s=0;
    if (d.from<to && i>d.from && i<=to) s=-d.step; else if (to<d.from && i>=to && i<d.from) s=d.step;
    r.style.transform = s ? `translateY(${s}px)` : ''; });
}
function dragEnd(){
  const d=drag; drag=null; suppressClick=Date.now()+400;
  if (d.to!==d.from){ const hs=S.habits.slice(); const [m]=hs.splice(d.from,1); hs.splice(d.to,0,m); S.habits=hs; save(); }
  render();
}
document.addEventListener('touchstart', e=>{
  const row=e.target.closest('#hlist .hrow'); if(!row || S.editing || e.target.closest('.x')) return;
  const y=e.touches[0].clientY;
  if (e.target.closest('.grip')){ dragStart(row,y); return; }
  lp={row,y,t:setTimeout(()=>{ if(lp){ dragStart(lp.row,lp.y); lp=null; } },320)};
},{passive:true});
document.addEventListener('touchmove', e=>{
  const y=e.touches[0].clientY;
  if (drag){ e.preventDefault(); dragMove(y); return; }
  if (lp && Math.abs(y-lp.y)>8){ clearTimeout(lp.t); lp=null; }
},{passive:false});
const touchEnd=()=>{ if(lp){ clearTimeout(lp.t); lp=null; } if(drag) dragEnd(); };
document.addEventListener('touchend', touchEnd); document.addEventListener('touchcancel', touchEnd);
document.addEventListener('contextmenu', e=>{ if(e.target.closest('#hlist')) e.preventDefault(); });
document.addEventListener('mousedown', e=>{ const g=e.target.closest('#hlist .grip'); if(!g || drag) return; e.preventDefault(); dragStart(g.closest('.hrow'), e.clientY); });
document.addEventListener('mousemove', e=>{ if(drag) dragMove(e.clientY); });
document.addEventListener('mouseup', ()=>{ if(drag) dragEnd(); });

/* ---------- events ---------- */
document.getElementById('gear').innerHTML = I.gear;
document.addEventListener('click', e=>{
  if (Date.now() < suppressClick) return;
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if (a==='close' && e.target!==b && b.classList.contains('scrim')) return;
  if (a==='toggle') toggle(b.dataset.k, b.dataset.id, b.querySelector('.box')||b);
  else if (a==='tab'){ if (S.tab!==b.dataset.tab) S.enter=true; S.tab=b.dataset.tab; history.replaceState(null,'','#'+S.tab); sfx('tap'); render(); window.scrollTo(0,0); }
  else if (a==='sound'){ S.sound=!S.sound; save(); render(); sfx('check',3); }
  else if (a==='day'){ const n=key(addDays(parse(S.sel),+b.dataset.d)); S.sel = n>todayK()?todayK():n; render(); }
  else if (a==='today'){ S.sel=todayK(); render(); }
  else if (a==='sheet'){ S.sheet=b.dataset.sheet||'habits'; S.armed=null; S.editing=null; render(); }
  else if (a==='close'){ S.sheet=null; S.armed=null; S.editing=null; render(); }
  else if (a==='edith'){ S.editing=b.dataset.id; S.armed=null; render(); const n=document.getElementById('e-name'); if(n) n.focus(); }
  else if (a==='canceledit'){ S.editing=null; render(); }
  else if (a==='export') exportBackup();
  else if (a==='enablepush') enablePush();
  else if (a==='copypush') copyPush();
  else if (a==='sharepush') sharePush();
  else if (a==='testpush') testPush();
  else if (a==='import') arm('import', importBackup);
  else if (a==='delw') arm('w'+b.dataset.k, ()=>{ S.weights=S.weights.filter(w=>w.date!==b.dataset.k); save(); render(); toast('Peso borrado'); });
  else if (a==='delh') arm('h'+b.dataset.id, ()=>{ S.habits=S.habits.filter(h=>h.id!==b.dataset.id); save(); render(); });
});
document.addEventListener('submit', e=>{
  e.preventDefault();
  if (e.target.id==='wform'){
    const d=document.getElementById('w-date').value, kg=parseKg(document.getElementById('w-kg').value);
    if (!d || !(kg>=30 && kg<=250)){ toast('Pon el peso en kg, por ejemplo 72,35'); return; }
    const v=kg;
    const others=S.weights.filter(w=>w.date!==d), prevMax=others.reduce((m,w)=>Math.max(m,w.kg),0), isNew=others.length===S.weights.length, lvB=levelInfo().lv;
    const br=e.target.querySelector('button[type=submit]').getBoundingClientRect();
    S.weights=others.concat({date:d,kg:v}).sort((a,b)=>a.date<b.date?-1:1);
    document.getElementById('w-kg').value='';
    S.enter=true; save(); render(); window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
    spawn(br.left+br.width/2, br.top, 26, {speed:8});
    if (isNew) floatText(br.left+br.width/2, br.top, '+20 XP');
    if (prevMax && v>prevMax) celebrate({ kicker:'Peso', title:'NUEVO MÁXIMO', sub:`${kgf(v)} kg · +${kgf(v-prevMax)} sobre tu tope anterior`, sound:'perfect' });
    else { sfx('coin'); toast(`${kgf(v)} kg guardado`); }
    const lvA=levelInfo(); if (lvA.lv>lvB) celebrate({ kicker:'Subes de nivel', title:'NIVEL '+lvA.lv, sub:lvA.rank, sound:'level' });
  } else if (e.target.id==='gform'){
    const raw=document.getElementById('goal').value.trim(); const g=raw===''?null:parseKg(raw);
    if (g!==null && !(g>=30 && g<=250)){ toast('Pon el objetivo en kg, por ejemplo 78,5'); return; }
    S.goal = g; save(); render(); toast(g?`Objetivo: ${kgf(g)} kg`:'Objetivo quitado');
  } else if (e.target.id==='eform'){
    const id=e.target.dataset.id, name=document.getElementById('e-name').value.trim(); if(!name) return;
    const type=document.getElementById('e-type').value, target=Math.min(7,Math.max(1,parseInt(document.getElementById('e-target').value)||1));
    S.habits=S.habits.map(h=>h.id!==id ? h : (type==='weekly' ? {id,name,type,target} : {id,name,type}));
    S.editing=null; syncRecords(); save(); render(); toast('Hábito actualizado');
  } else if (e.target.id==='hform'){
    const name=document.getElementById('h-name').value.trim(); if(!name) return;
    const type=document.getElementById('h-type').value, target=Math.min(7,Math.max(1,parseInt(document.getElementById('h-target').value)||1));
    const id=(name.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,20)||'habito')+'-'+Math.random().toString(36).slice(2,6);
    S.habits=S.habits.concat(type==='weekly'?{id,name,type,target}:{id,name,type}); document.getElementById('h-name').value='';
    save(); render(); toast(`${name} añadido`);
  }
});
window.addEventListener('hashchange',()=>{ const t=location.hash.slice(1); if(['hoy','rachas','peso'].includes(t)){ if(S.tab!==t) S.enter=true; S.tab=t; render(); } });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ if(S.sel>todayK()) S.sel=todayK(); render(); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e=>{ if(e.data && e.data.tab && ['hoy','peso','rachas'].includes(e.data.tab)){ S.tab=e.data.tab; S.sheet=null; render(); } });
window.addEventListener('storage', e=>{ if(e.key===KEY){ load(); render(); } });

/* ---------- boot ---------- */
const t=location.hash.slice(1); if(['hoy','rachas','peso'].includes(t)) S.tab=t;
load(); render(); mirror(); refreshPush();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if ('serviceWorker' in navigator) window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
